  suites:                         # upstream .github/workflows/v3-ci.yml and frontend-ci.yml, replayed
    - name: server                # jobs Tests, Clippy, Format; Licenses/Audit = cargo-deny (deny: on for server/Cargo.toml)
      image: rust:1.89.0-bookworm@sha256:948f9b08a66e7fe01b03a98ef1c7568292e07ec2e4fe90d88c07bb14563c84ff
      workdir: server             # rustup follows rust-toolchain.toml, also when upstream moves it
      # tests on 4 threads: the module's default test-threads (base/dagger-modules 92c5325); 16
      # threads under the runner's 8-CPU quota time out an upstream test (PoolTimedOut)
      steps:
        - apt-get update -qq && apt-get install -y -qq --no-install-recommends cmake   # opusic-sys builds a bundled C library
        - rustup component add clippy rustfmt
        - cargo fmt --check
        - cargo clippy --workspace --all-targets -- -D warnings
        - cargo clippy --workspace --lib --bins -- -D warnings
        # -j 3: at the default (one build job per CPU) this step filled the dind container's
        # then 8 GiB and the run thrashed for hours (sync PR #75, 2026-10-27: `cargo test` from
        # 01:20Z, OOM kill in the runner pod at 03:04Z; kubernetes/forgejo-runner now allows
        # 12 GiB). Linking the test binaries in parallel is the measured peak: locally
        # `ld terminated with signal 9` in a 16 GiB VM at the default, green at -j 3.
        - cargo test --workspace -j 3
    - name: frontend              # jobs Lint, Format & Type Check, Tests
      image: node:22-bookworm@sha256:f6f56d63a2f4faaec7b1298e2fc833873c6dfb773dff85d9b0886803089d7db7
      workdir: frontend           # .github/node-version: 22; pnpm from package.json packageManager
      caches: [/root/.local/share/pnpm/store, /root/.cache/ms-playwright]
      steps:
        - corepack enable && corepack install
        - pnpm install --frozen-lockfile
        - pnpm run lint
        - pnpm run format:check
        - pnpm run check
        # --retry.count=1: a test that fails and then passes is reported as flaky, not red. A flaky
        # upstream test failed two fork-checks in a row on 2026-10-30 (SearchSuggestions
        # debounce, ~50 min per rerun); a real regression still fails twice
        - pnpm exec vitest run --project server --retry.count=1
        - pnpm exec playwright install --with-deps chromium
        - pnpm exec vitest run --project client --retry.count=1
