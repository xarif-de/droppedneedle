# Gates every PR into xarif (base/dagger-modules docs/fork.md): sync PRs are recomputed
# and run the upstream suite; other PRs may only change the infra paths.
name: fork-check
on:
  pull_request:
# One run per repo at a time; later runs queue, none is replaced
# (base/dagger-modules docs/ci.md#one-runner-slot-per-repo).
concurrency:
  group: one-runner-slot-per-repo
  cancel-in-progress: false
jobs:
  check:
    uses: base/dagger-modules/.forgejo/workflows/dagger-fork-check.yml@main
    secrets: inherit
